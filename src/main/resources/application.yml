server:
  # Render (e outros PaaS) define a porta na variável PORT; localmente continua 8080.
  port: ${PORT:8080}

spring:
  application:
    name: payment-api

  datasource:
    # DB_URL completa tem prioridade (ex.: Neon exige ?sslmode=require).
    # Sem ela, monta a URL pelas partes, como antes — docker-compose e testes
    # não mudam nada.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payment_api}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    # Em produção, SQL no log só custa CPU e polui o log. O perfil dev liga de novo.
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

# Segredos SEM valor padrão de propósito (fail-fast): se JWT_SECRET ou
# WEBHOOK_SECRET não estiverem definidos, o Spring não resolve o placeholder
# e a aplicação se recusa a subir. Um default aqui faria um deploy sem a
# variável subir "normalmente" com um segredo público no GitHub — e quem tem
# o segredo do JWT consegue forjar um token de ADMIN.
# Para rodar localmente, ative o perfil "dev" (ver application-dev.yml).
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

webhook:
  # Em produção, combinado com o gateway de pagamento real (cada gateway tem
  # seu próprio segredo, configurável no painel dele).
  secret: ${WEBHOOK_SECRET}
